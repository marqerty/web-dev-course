<html>
    <head>
        <title>
            Форма авторизации
        </title>
        <link rel="stylesheet" href="./styles.css" />
        <link rel="icon" href="./images/cat.svg" type="image/svg" sizes="32x32">
    </head>
    <body>
        <header>
            Account
        </header>

        <main class="main">
            <div class="card outline">
                <h1>Create your account</h1>
                <p class="signin">Do you already have an account? <a href="/link">Sign in <img src="./images/arrow.svg" height="10" alt="arrow"></a></p>
                
                <!-- <button>войти через ЛK ВШЭ</button>
                <button>войти через Google</button> -->

                <div class="together">
                    <input type="text" placeholder="First Name"/>
                    <input type="text" placeholder="Last Name"/>
                </div>

                <select name="country">
                    <option selected disabled>Country</option>
                    <option>United States</option>
                    <option>Canada</option>
                    <option>United Kingdom</option>
                </select>

                <label class="birthday">Birthday
                    <img src="./images/questsign.svg" height="16" 
                    title="This information is used to verify your age and provide a personalized experience."
                    alt="Question mark icon">

                    <div class="together">
                        <select name="month" >
                            <option selected disabled>Month</option>
                            <option>January</option>
                            <option>February</option>
                            <option>March</option>
                            <option>April</option>
                            <option>May</option>
                            <option>June</option>
                            <option>July</option>
                            <option>August</option>
                            <option>September</option>
                            <option>October</option>
                            <option>November</option>
                            <option>December</option>
                        </select>

                        <select name="day" >
                            <option selected disabled>Day</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>
                            <option>9</option>
                            <option>10</option>
                        </select>

                        <select name="year" >
                            <option selected disabled>Year</option>
                            <option>2026</option>
                            <option>2025</option>
                            <option>2024</option>
                            <option>2023</option>
                            <option>2022</option>
                            <option>2021</option>
                        </select>
                    </div>
                </label>

                <input type="email" placeholder="name@example.com"/>
                <input type="password" placeholder="Password"/>
                <input type="password" placeholder="Confirm Password"/>

                <select name="country options">
                    <option selected>(+1) United States</option>
                    <option>(+44) United Kingdom</option>
                </select>

                <label>
                    <input type="tel" placeholder="Phone Number"/>
                    <p>Be sure to enter a phone number you can always access. 
                    It will be used to verify your identity any time you sign 
                    in on a new device or web browser. Messaging or data rates 
                    may apply.
                    </p>
                </label>

                <label>
                    <input type="checkbox" name="ads"/>
                    <b>Announcement</b>
                    <p class="announcement">Receive Apple emails and communications including 
                        announcements, marketing, recommendations, and updates 
                        about Apple products, services and software.
                    </p>
                </label>

                <label>
                    <input type="checkbox" name="ads"/>
                    <b>Apps, Music, TV, and More</b>
                    <p class="announcement">Receive Apple emails and communications including new 
                        releases, exclusive content, special offers, and marketing 
                        and recommendations for apps, music, movies, TV, books, podcasts, 
                        Apple Pay, Apple Card and more.
                    </p>
                </label>

                <button class="buttonenter">Continue</button>
            </div>

        </main>
        <footer>
            Это подвал тут танцует котик
            <img src="./images/cat-cat-dance.gif" alt="Cat dancing" width="100" height="100">
        </footer>

    </body>
</html>
